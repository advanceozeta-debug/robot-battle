<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>야간 퇴마부 대전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Gothic+A1:wght@500;700;900&display=swap">
<style>
/* Layout: versus frame — mirrored 1P/2P bars with round marks, shared 3D rooftop, 1P thumb controls. Single dark look by choice. */
:root{
  --ink:#0d0f1c; --ink-2:#171a2e; --line:#2a2f4d;
  --paper:#ecd48a; --seal:#c7372f; --spirit:#9fe6d6; --text:#e7e4da; --dim:#8c8aa3; --mana:#7fb0ff; --p2:#ff6a5a;
  --display:"Nanum Myeongjo","Batang",serif;
  --ui:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;font-size:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.side{display:grid;gap:4px;min-width:0}
.side.r{text-align:right}
.nm{font-family:var(--display);font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-family:var(--ui);font-size:10px;color:var(--dim);margin:0 6px;font-weight:700}
.tagp{font-family:var(--ui);font-size:10px;font-weight:900;padding:1px 4px;border-radius:2px;margin-right:6px;background:var(--spirit);color:var(--ink);vertical-align:2px}
.side.r .tagp{background:var(--p2);margin:0 0 0 6px}
.bar{height:10px;background:var(--ink-2);border:1px solid var(--line);border-radius:2px;overflow:hidden;display:flex}
.side.r .bar{justify-content:flex-end}
.bar i{display:block;height:100%;width:100%;transition:width .15s;background:var(--seal)}
.bar.g{height:6px}
.bar.g i{background:var(--mana)}
.bar.g.full i{background:var(--paper);box-shadow:0 0 8px var(--paper)}
.rd{display:flex;gap:4px}
.side.r .rd{justify-content:flex-end}
.rd b{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--line);background:var(--ink-2)}
.rd b.on{background:var(--paper);border-color:var(--paper)}
.vs{font-family:var(--display);font-size:20px;color:var(--dim);text-align:center;padding-top:2px}
.vs small{display:block;font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.1em}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
#banner{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#banner.show{opacity:1}
#banner h2{font-family:var(--display);font-size:clamp(32px,9vw,52px);margin:0;text-shadow:0 2px 18px #000}
#banner p{margin:6px 0 0;font-weight:700;font-size:13px;color:var(--spirit);text-shadow:0 1px 8px #000;letter-spacing:.1em}
.pop{position:absolute;top:8%;width:50%;text-align:center;pointer-events:none;font-family:var(--display);font-size:19px;opacity:0;text-shadow:0 2px 10px #000;padding-inline:8px;box-sizing:border-box}
#pop0{left:0}#pop1{right:0}
.pop.anim{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.over{position:absolute;inset:0;z-index:5;display:flex;overflow-y:auto;background:color-mix(in srgb,var(--ink) 74%,transparent);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:min(560px,100%)}
.over h1{font-family:var(--display);font-size:clamp(30px,8vw,50px);margin:0;letter-spacing:.04em;text-wrap:balance;text-shadow:0 0 24px rgba(159,230,214,.35)}
.over h1 em{font-style:normal;color:var(--seal)}
.over p{margin:0;max-width:40ch;line-height:1.6;color:var(--dim);font-size:13px}
.tag{font-size:11px;letter-spacing:.3em;color:var(--spirit);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font-family:var(--ui);font-weight:700;font-size:13px;color:var(--dim);background:var(--ink-2);border:0;padding:8px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--spirit);outline-offset:-2px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.col{display:grid;gap:6px;min-width:0;align-content:start}
.sec{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--spirit);text-align:left}
.col.p2 .sec{color:var(--p2)}
.ros{font-family:var(--ui);color:var(--text);background:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:baseline;gap:6px;text-align:left;min-width:0}
.ros b{font-family:var(--display);font-size:16px}
.ros span{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ros[aria-pressed="true"]{border-color:var(--spirit);background:color-mix(in srgb,var(--spirit) 12%,var(--ink-2))}
.col.p2 .ros[aria-pressed="true"]{border-color:var(--p2);background:color-mix(in srgb,var(--p2) 12%,var(--ink-2))}
.ros:focus-visible{outline:2px solid var(--spirit);outline-offset:2px}
.info{font-size:11px;line-height:1.55;color:var(--dim);text-align:left;min-height:4.6em}
.info b{color:var(--text);font-weight:700}
.go{font-family:var(--ui);font-weight:900;font-size:15px;letter-spacing:.08em;color:var(--ink);background:var(--paper);border:0;padding:12px 28px;cursor:pointer;border-radius:2px}
.go.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.go:focus-visible{outline:2px solid var(--spirit);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.keys{font-size:11px;color:var(--dim);line-height:1.9;max-width:52ch}
.keys kbd{font-family:var(--ui);border:1px solid var(--line);padding:0 4px;border-radius:2px;color:var(--text)}
.netbox{display:grid;gap:8px;justify-items:center;width:100%}
#code{font-family:var(--ui);font-weight:900;font-size:16px;letter-spacing:.3em;text-transform:uppercase;width:8ch;text-align:center;background:var(--ink-2);color:var(--text);border:1px solid var(--line);border-radius:2px;padding:10px 6px}
#code:focus-visible{outline:2px solid var(--spirit);outline-offset:2px}
.netbox .go{padding:10px 16px;font-size:13px}
.status{font-size:12px;color:var(--spirit);font-weight:700;line-height:1.5}
.go:disabled{opacity:.55;cursor:default}
.ros:disabled{cursor:default}
#skbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:1;pointer-events:none;max-width:calc(100% - 32px)}
body.touch #skbar{display:none}
.skc{position:relative;min-width:0;width:96px;padding:6px 8px;border:1px solid var(--spirit);border-radius:3px;background:rgba(13,15,28,.78);display:grid;gap:2px;font-size:11px;overflow:hidden}
.skc.u{border-color:var(--seal)}
.skc b{font-family:var(--display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skc span{color:var(--dim)}
.skc kbd{position:absolute;right:6px;top:5px;font-family:var(--ui);font-size:10px;color:var(--text);border:1px solid var(--line);padding:0 3px;border-radius:2px}
.skc.low{opacity:.5}
.skc[data-cd]:not([data-cd=""])::after,.tc .btn[data-cd]:not([data-cd=""])::after{content:attr(data-cd);position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,15,28,.62);border-radius:inherit;font-family:var(--ui);font-weight:900;font-size:16px;color:var(--text)}
/* touch controls: same layout as 기계 총격전 */
.tc{display:none;position:absolute;inset:0;z-index:2;touch-action:none}
body.touch .tc{display:block}
.lpad{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:300px;height:300px;pointer-events:none}
.joy{position:absolute;left:50%;top:50%;width:144px;height:144px;margin:-72px 0 0 -72px;border-radius:50%;border:1px solid rgba(231,228,218,.35);background:rgba(23,26,46,.35);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(231,228,218,.55)}
.joy.idle{opacity:.45}
.lpad .btn{pointer-events:auto}
.tc .btn{position:absolute;border-radius:50%;border:1px solid var(--line);background:rgba(23,26,46,.62);color:var(--text);font-family:var(--ui);font-weight:900;font-size:15px;line-height:1.1;display:grid;place-items:center;padding:0 4px;word-break:keep-all;touch-action:none;-webkit-tap-highlight-color:transparent}
.tc .btn.on{filter:brightness(1.5)}
.tc .btn.low{opacity:.42}
.btn.fire{width:106px;height:106px;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));background:rgba(236,212,138,.88);border-color:var(--paper);color:var(--ink);font-size:21px}
.btn.sk{width:70px;height:70px;font-size:13px;color:var(--spirit);border-color:var(--spirit);background:rgba(18,46,46,.62)}
.btn.sk1{right:calc(40px + env(safe-area-inset-right,0px));bottom:calc(204px + env(safe-area-inset-bottom,0px))}
.btn.sk2{right:calc(40px + env(safe-area-inset-right,0px));bottom:calc(286px + env(safe-area-inset-bottom,0px))}
.btn.sk3{right:calc(140px + env(safe-area-inset-right,0px));bottom:calc(250px + env(safe-area-inset-bottom,0px));color:#ffd38a;border-color:#6b5428;background:rgba(48,34,12,.62)}
.btn.ult{width:70px;height:70px;right:calc(140px + env(safe-area-inset-right,0px));bottom:calc(168px + env(safe-area-inset-bottom,0px));color:var(--dim)}
.btn.ult.ready{background:var(--seal);color:var(--paper);border-color:var(--seal);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(199,55,47,.28)}}
.tc .btn.qs{font-size:19px;color:#ffb43a;border-color:#6b4418;background:rgba(40,26,12,.6);border-radius:14px}
.qs.qf,.qs.qb{width:140px;height:58px;left:50%;margin-left:-70px}.qs.qf{top:0}.qs.qb{bottom:0}
.qs.ql,.qs.qr{width:58px;height:140px;top:50%;margin-top:-70px}.qs.ql{left:0}.qs.qr{right:0}
@media (orientation:landscape) and (max-height:440px){
  .lpad{width:272px;height:252px}.joy{width:132px;height:132px;margin:-66px 0 0 -66px}.joy i{width:56px;height:56px;margin:-28px 0 0 -28px}
  .qs.qf,.qs.qb{width:124px;height:50px;margin-left:-62px}.qs.ql,.qs.qr{width:52px;height:120px;margin-top:-60px}
  .btn.fire{width:94px;height:94px;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .btn.sk,.btn.ult{width:64px;height:64px}
  .btn.ult{right:calc(126px + env(safe-area-inset-right,0px));bottom:calc(148px + env(safe-area-inset-bottom,0px))}
  .btn.sk1{right:calc(34px + env(safe-area-inset-right,0px));bottom:calc(180px + env(safe-area-inset-bottom,0px))}
  .btn.sk2{right:calc(202px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .btn.sk3{right:calc(202px + env(safe-area-inset-right,0px));bottom:calc(148px + env(safe-area-inset-bottom,0px))}
}
@media (orientation:portrait){
  .lpad{width:204px;height:204px}.joy{width:108px;height:108px;margin:-54px 0 0 -54px}.joy i{width:48px;height:48px;margin:-24px 0 0 -24px}
  .tc .btn.qs{font-size:14px}.qs.qf,.qs.qb{width:92px;height:44px;margin-left:-46px}.qs.ql,.qs.qr{width:44px;height:92px;margin-top:-46px}
  .btn.fire{width:100px;height:100px;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(142px + env(safe-area-inset-bottom,0px))}
  .btn.sk,.btn.ult{width:64px;height:64px}
  .btn.sk1{right:calc(40px + env(safe-area-inset-right,0px));bottom:calc(256px + env(safe-area-inset-bottom,0px))}
  .btn.sk2{right:calc(40px + env(safe-area-inset-right,0px));bottom:calc(334px + env(safe-area-inset-bottom,0px))}
  .btn.ult{right:calc(140px + env(safe-area-inset-right,0px));bottom:calc(230px + env(safe-area-inset-bottom,0px))}
  .btn.sk3{right:calc(140px + env(safe-area-inset-right,0px));bottom:calc(306px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.btn.ult.ready{animation:none}.pop.anim{animation-duration:.01s}}
</style>

</head>
<body>
<div id="app">
  <div id="hud">
    <div class="side"><div class="nm"><span class="tagp" id="tag0">1P</span><span id="n0">하람</span><small id="t0">영력 0</small></div><div class="bar"><i id="hp0"></i></div><div class="bar g" id="gb0"><i id="mp0"></i></div><div class="rd" id="rd0"><b></b><b></b></div></div>
    <div class="vs">對<small id="rlab">1라운드</small></div>
    <div class="side r"><div class="nm"><small id="t1">영력 0</small><span id="n1">백랑</span><span class="tagp" id="tag1">CPU</span></div><div class="bar"><i id="hp1"></i></div><div class="bar g" id="gb1"><i id="mp1"></i></div><div class="rd" id="rd1"><b></b><b></b></div></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="flash"></div>
    <div id="banner"><h2 id="bnH">1라운드</h2><p id="bnP"></p></div>
    <div class="pop" id="pop0"></div><div class="pop" id="pop1"></div>
    <div id="skbar"></div>
    <div class="tc" id="tc">
      <div class="lpad"><div class="joy idle" id="joy"><i id="knob"></i></div>
        <button class="btn qs qf" data-k="qf" aria-label="앞으로 대시">▲</button><button class="btn qs qb" data-k="qb" aria-label="뒤로 대시">▼</button><button class="btn qs ql" data-k="ql" aria-label="왼쪽으로 대시">◀</button><button class="btn qs qr" data-k="qr" aria-label="오른쪽으로 대시">▶</button></div>
      <button class="btn fire" data-k="atk" id="bAtk">베기</button>
      <button class="btn ult" data-k="ult" id="bUlt">결계</button>
      <button class="btn sk sk1" data-k="s1" id="bS1">비술1</button>
      <button class="btn sk sk2" data-k="s2" id="bS2">비술2</button>
      <button class="btn sk sk3" data-k="s3" id="bS3">비술3</button>
    </div>
    <div class="over" id="select"><div class="wrap">
      <div class="tag">자정의 옥상 · 3판 2선승</div>
      <h1>야간 <em>퇴마부</em> 대전</h1>
      <div class="seg" id="mode"><button data-v="cpu">컴퓨터와 대전</button><button data-v="2p">둘이서 대전</button><button data-v="net">온라인 대전</button></div>
      <div class="seg" id="diff"><button data-v="easy">쉬움</button><button data-v="normal">보통</button><button data-v="hard">어려움</button></div>
      <div class="netbox" id="net" hidden>
        <div class="row"><button class="go ghost" id="mkRoom">방 만들기</button><input id="code" maxlength="6" placeholder="코드" autocomplete="off" aria-label="방 코드"><button class="go ghost" id="joinRoom">입장</button></div>
        <div class="status" id="netStatus">방을 만들거나, 친구가 알려 준 코드를 넣고 입장하세요.</div>
      </div>
      <div class="pick">
        <div class="col"><div class="sec" id="p1lab">1P</div><div id="r0" class="col"></div><div class="info" id="i0"></div></div>
        <div class="col p2"><div class="sec" id="p2lab">CPU</div><div id="r1" class="col"></div><div class="info" id="i1"></div></div>
      </div>
      <button class="go" id="start">대전 시작</button>
      <p>비술 세 개와 결계를 처음부터 모두 쓸 수 있어요. 쓸 때마다 영력이 들고 각자 쿨타임이 돌아요. 영력은 가득 찬 채로 시작해서 계속 차올라요. 결계는 영력 50, 쿨타임 20초예요. 상대 머리 위가 붉게 빛나면 바닥 범위 공격이니 대시로 빠져나오세요.</p>
      <div class="keys" id="keys"></div>
    </div></div>
    <div class="over" id="end" hidden><div class="wrap">
      <div class="tag" id="endTag">대전 종료</div>
      <h1 id="endH">1P 승리</h1>
      <p id="endP"></p>
      <div class="row"><button class="go" id="again">다시 대전</button><button class="go ghost" id="back">캐릭터 선택</button></div>
    </div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv');
const V3=THREE.Vector3,PI=Math.PI,A=11.3;

// ================= renderer & world =================
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0f1c);scene.fog=new THREE.Fog(0x0d0f1c,30,90);
const cam=new THREE.PerspectiveCamera(55,1,.1,300);let camK=1;
function resize(){const r=stage.getBoundingClientRect();if(!r.width)return;renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();camK=r.width<r.height?1.3:1}
new ResizeObserver(resize).observe(stage);
scene.add(new THREE.HemisphereLight(0x8a9ad0,0x14121e,.8));
const moonL=new THREE.DirectionalLight(0xb8c6ff,.75);moonL.position.set(-20,30,-25);scene.add(moonL);
const lam=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const basic=(c,o={})=>new THREE.MeshBasicMaterial(Object.assign({color:c},o));
const GLOW=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const glow=(c,s)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:c,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));m.scale.setScalar(s);return m};
(function world(){
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(26,26),lam(0x2a2e42));floor.rotation.x=-PI/2;scene.add(floor);
  const lineM=basic(0x343a56);
  for(let i=-12;i<=12;i+=3){const a=new THREE.Mesh(new THREE.PlaneGeometry(.05,26),lineM);a.rotation.x=-PI/2;a.position.set(i,.01,0);scene.add(a);
    const b=new THREE.Mesh(new THREE.PlaneGeometry(26,.05),lineM);b.rotation.x=-PI/2;b.position.set(0,.01,i);scene.add(b)}

function netEnd(msg){S.gen++;closeDomain();S.state='end';NET.ready=NET.match;
  $('endTag').textContent='온라인 대전';$('endH').textContent='대전 중단';$('endP').textContent=msg;$('again').disabled=false;$('end').hidden=false}
function readyUp(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(_){}
  if(!NR){renderSelect();return false}NET.ready=NET.match+1;pushLobby();renderSelect();onNetPeers();return true}
$('mkRoom').onclick=()=>joinRoom(rcode());
$('joinRoom').onclick=()=>joinRoom($('code').value);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();joinRoom($('code').value)}});

function previewFighters(){S.me=0;S.fp=S.mode==='net'?[S.pick[0],remoteCh()||S.pick[1]]:S.pick.slice();const md=S.mode;if(md==='net')S.mode='cpu';setupFighters();S.mode=md;resetRound();S.f[0].pos.set(-2.2,0,1.5);S.f[1].pos.set(2.2,0,-1.5);for(const F of S.f){const o=opp(F);F.face=Math.atan2(o.pos.x-F.pos.x,o.pos.z-F.pos.z)}}
$('start').onclick=()=>{if(S.mode==='net')readyUp();else startMatch()};
$('again').onclick=()=>{if(S.mode!=='net'){startMatch();return}
  if(!NR){$('back').click();return}
  if(readyUp()&&S.state==='end'){$('again').disabled=true;$('endP').textContent='상대가 다시 대전을 누르길 기다리는 중…'}};
$('back').onclick=()=>{S.gen++;$('end').hidden=true;$('again').disabled=false;S.state='select';if(S.mode==='net'){NET.ready=NET.match;pushLobby()}renderSelect();previewFighters();$('select').hidden=false};
resize();renderSelect();previewFighters();requestAnimationFrame(loop);
})();
</script>
